name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build package
        run: |
          python -m build
          echo ""
          echo "✅ Build completed, checking dist directory:"
          ls -lh dist/
      
      - name: Verify build artifacts
        run: |
          echo "📦 Built files:"
          ls -lh dist/
          
          # Count wheel files
          wheel_count=$(ls -1 dist/*.whl 2>/dev/null | wc -l)
          if [ "$wheel_count" -eq 0 ]; then
            echo "❌ No wheel file found!"
            exit 1
          fi
          
          echo "✅ Found $wheel_count wheel file(s)"
      
      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Create Release Notes
        run: |
          cat > release_notes.md << 'EOF'
          ## IrpAI v${{ steps.get_version.outputs.VERSION }}
          
          ### 📦 Installation
          
          Download the wheel file and install with your preferred extras:
          
          #### Minimal (Core dependencies only)
          ```bash
          pip install irpai-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl
          ```
          
          #### With ML Features
          ```bash
          pip install irpai-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl[core]
          ```
          
          #### Full (All runtime dependencies)
          ```bash
          pip install irpai-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl[full]
          ```
          
          #### Development (Full + dev tools)
          ```bash
          pip install irpai-${{ steps.get_version.outputs.VERSION }}-py3-none-any.whl[dev]
          ```
          
          ### 📋 Available Extras
          
          ```bash
          pip install irpai[core]       # Basic ML (torch, transformers)
          pip install irpai[ocr]        # OCR engines
          pip install irpai[llm]        # LLM providers
          pip install irpai[gpu]        # GPU acceleration
          pip install irpai[full]       # All runtime features
          pip install irpai[dev]        # Development tools
          ```
          
          Combine multiple extras:
          ```bash
          pip install irpai[ocr,llm]
          pip install irpai[full,gpu]
          ```
          
          ### 📊 Installation Options
          
          | Install Command | Includes | Use Case |
          |----------------|----------|----------|
          | `pip install irpai` | OpenCV, NumPy, Pillow | Minimal |
          | `pip install irpai[core]` | + ML features | Standard use |
          | `pip install irpai[full]` | All runtime deps | Production |
          | `pip install irpai[dev]` | Full + dev tools | Development |
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Published:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/ >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation Options:" >> $GITHUB_STEP_SUMMARY
          echo "- \`pip install irpai\` - Minimal" >> $GITHUB_STEP_SUMMARY
          echo "- \`pip install irpai[core]\` - ML features" >> $GITHUB_STEP_SUMMARY
          echo "- \`pip install irpai[full]\` - All features" >> $GITHUB_STEP_SUMMARY
          echo "- \`pip install irpai[dev]\` - Development" >> $GITHUB_STEP_SUMMARY
