[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irpai"
version = "0.2.0"
description = "Image Resolution Pipeline AI - Machine vision preprocessing for enhanced LLM-screenshot interactions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "IrpAI Team"}
]
keywords = ["machine-vision", "llm", "screenshot", "ocr", "ui-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Core dependencies (minimal install)
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Core ML dependencies
core = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "sentence-transformers>=2.2.0",
]

# Full installation (everything except dev)
full = [
    "irpai[core,ocr,llm]",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
]

# Development tools
dev = [
    "irpai[full]",  # Dev includes everything
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# Optional integrations
llm = [
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "anthropic>=0.34.0",
    "langchain-community>=0.2.0",
]

ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "easyocr>=1.7.0",
    "pytesseract>=0.3.10",
]

gpu = [
    "detectron2>=0.6",
]

[project.scripts]
irpai = "irpai.cli:app"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["irpai*"]
namespaces = false

[tool.setuptools.package-data]
irpai = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
