[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irpai"
version = "0.1.0"
description = "Image Resolution Pipeline AI — lightweight machine vision pipeline for screenshot understanding and LLM context generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Aakaash"},
]
keywords = ["screenshot", "ocr", "vision", "llm", "context", "pipeline", "ui-understanding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
ocr-easyocr = [
    "easyocr>=1.7",
    "torch>=2.0",
    "torchvision>=0.15",
]
all = [
    "irpai[ocr-easyocr]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/aakaash/irpai"
Repository = "https://github.com/aakaash/irpai"
Issues = "https://github.com/aakaash/irpai/issues"

[project.scripts]
irpai = "irpai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["irpai*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
